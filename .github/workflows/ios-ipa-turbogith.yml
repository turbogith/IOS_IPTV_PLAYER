name: build-ios-ipa

on:
  workflow_dispatch:
    inputs:
      bundle-id:
        description: "fr.turbo.IPTV"
        default: "fr.turbo.IPTV"
        required: true

concurrency:
  group: ios-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 16 (Realm ne compile pas avec Xcode 26)
        run: |
          ls -d /Applications/Xcode*.app
          XCODE16=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE16" ]; then
            echo "Selection: $XCODE16"
            sudo xcode-select -s "$XCODE16"
          else
            echo "Pas de Xcode 16 trouve, on garde le defaut"
          fi
          xcodebuild -version

      - name: Remonte les sources si imbriquees dans un sous-dossier
        run: |
          if [ ! -f sources/IPTV.xcodeproj/project.pbxproj ]; then
            for d in */; do
              if [ -f "${d}sources/IPTV.xcodeproj/project.pbxproj" ]; then
                echo "Remontee depuis $d"
                shopt -s dotglob nullglob
                mv "${d}"* ./
                rmdir "$d" || true
                break
              fi
            done
          fi
          test -f sources/IPTV.xcodeproj/project.pbxproj || (echo "ERREUR: projet introuvable" && exit 1)

      - name: Bundle ID perso
        run: |
          BID="${{ inputs.bundle-id }}"
          PBX=sources/IPTV.xcodeproj/project.pbxproj
          sed -i '' "s/fr\.meublin\.IPTV/${BID}/g" "$PBX"
          grep -o 'PRODUCT_BUNDLE_IDENTIFIER = [^;]*;' "$PBX" | sort -u

      - name: Carthage + VLCKit
        run: |
          brew install carthage || brew upgrade carthage
          cd sources
          carthage bootstrap --use-xcframeworks --platform iOS --cache-builds

      - name: GoogleCast SDK (manquant du depot)
        run: |
          cd sources
          if [ ! -d GoogleCast.xcframework ]; then
            curl -L -o /tmp/cast.zip https://dl.google.com/dl/chromecast/sdk/ios/GoogleCastSDK-ios-4.8.6_dynamic.zip
            rm -rf /tmp/cast && mkdir -p /tmp/cast
            unzip -q /tmp/cast.zip -d /tmp/cast
            cp -R /tmp/cast/GoogleCastSDK-ios-4.8.6_dynamic_xcframework/GoogleCast.xcframework ./GoogleCast.xcframework
            rm -rf /tmp/cast /tmp/cast.zip
          fi
          ls -d GoogleCast.xcframework

      - name: Pre-resolve les paquets Swift (pour patcher Realm avant compile)
        run: |
          cd sources
          xcodebuild -resolvePackageDependencies -project IPTV.xcodeproj -scheme IPTV-iOS -derivedDataPath build

      - name: Patch Realm s2 (DECLARE_POD + PROPAGATE)
        run: |
          chmod u+w sources/build/SourcePackages/checkouts/realm-core/src/external/s2/base/macros.h
          python3 - <<'PYEOF'
          import os, pathlib, subprocess
          f = pathlib.Path("sources/build/SourcePackages/checkouts/realm-core/src/external/s2/base/macros.h")
          assert f.exists(), "macros.h introuvable (le pre-resolve a echoue ?)"
          os.chmod(f, 0o644)
          t = f.read_text()
          pragma = [
                  "#if defined(__clang__) && defined(__has_warning)",
                  "#if __has_warning(\"-Winvalid-specialization\")",
                  "#define S2_PRAGMA_PUSH_INVALID_SPEC _Pragma(\"clang diagnostic push\") _Pragma(\"clang diagnostic warning \\\"-Winvalid-specialization\\\"\")",
                  "#define S2_PRAGMA_POP_INVALID_SPEC _Pragma(\"clang diagnostic pop\")",
                  "#else",
                  "#define S2_PRAGMA_PUSH_INVALID_SPEC",
                  "#define S2_PRAGMA_POP_INVALID_SPEC",
                  "#endif",
                  "#else",
                  "#define S2_PRAGMA_PUSH_INVALID_SPEC",
                  "#define S2_PRAGMA_POP_INVALID_SPEC",
                  "#endif",
              ]
          declare_body = [
                  "#define DECLARE_POD(TypeName)                       \\",
                  "S2_PRAGMA_PUSH_INVALID_SPEC                         \\",
                  "namespace std {                                     \\",
                  "template<> struct is_pod<TypeName> : true_type { }; \\",
                  "}                                                   \\",
                  "S2_PRAGMA_POP_INVALID_SPEC                          \\",
                  "typedef int Dummy_Type_For_DECLARE_POD              \\",
              ]
          propagate_body = [
                  "#define PROPAGATE_POD_FROM_TEMPLATE_ARGUMENT(TemplateName)             \\",
                  "S2_PRAGMA_PUSH_INVALID_SPEC                                           \\",
                  "namespace std {                                                       \\",
                  "template <typename T> struct is_pod<TemplateName<T> > : std::is_trivial<T> { }; \\",
                  "}                                                                      \\",
                  "S2_PRAGMA_POP_INVALID_SPEC                                            \\",
                  "typedef int Dummy_Type_For_PROPAGATE_POD_FROM_TEMPLATE_ARGUMENT",
              ]
          ls = t.split("\n")
          def idx_start(prefix):
              for i, l in enumerate(ls):
                  if l.startswith(prefix):
                      return i
              raise AssertionError("introuvable: " + prefix)
          if not any(l.startswith("#define S2_PRAGMA_PUSH_INVALID_SPEC") for l in ls):
              k = idx_start("#define DECLARE_POD(TypeName)")
              ls[k:k] = pragma
          i = idx_start("#define DECLARE_POD(TypeName)")
          if not ls[i + 1].startswith("S2_PRAGMA_PUSH_INVALID_SPEC"):
              assert ls[i + 1].strip().startswith("namespace std {") and ls[i + 1].strip().endswith("\\"), ls[i + 1]
              assert "struct is_pod<TypeName>" in ls[i + 2], ls[i + 2]
              assert ls[i + 4].strip().startswith("typedef int Dummy_Type_For_DECLARE_POD"), ls[i + 4]
              ls[i:i + 5] = declare_body
          j = idx_start("#define PROPAGATE_POD_FROM_TEMPLATE_ARGUMENT(TemplateName)")
          if not ls[j + 1].startswith("S2_PRAGMA_PUSH_INVALID_SPEC"):
              assert ls[j + 1].strip().startswith("namespace std {") and ls[j + 1].strip().endswith("\\"), ls[j + 1]
              assert "struct is_pod<TemplateName<T> >" in ls[j + 2], ls[j + 2]
              assert ls[j + 4].strip().startswith("typedef int Dummy_Type_For_PROPAGATE"), ls[j + 4]
              ls[j:j + 5] = propagate_body
          f.write_text("\n".join(ls))
          r = subprocess.run(["grep", "-rn", "struct is_pod", "sources/build/SourcePackages/checkouts/realm-core/src/external/s2"], capture_output=True, text=True)
          print("SITES is_pod restants:")
          print(r.stdout[:3000])
          print("patche OK")
          PYEOF

      - name: Build (unsigned, pour sideload)
        run: |
          cd sources
          set -o pipefail
          xcodebuild \
            -project IPTV.xcodeproj \
            -scheme IPTV-iOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | tail -n 50

      - name: Log de build (si echec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: sources/build.log
          retention-days: 14

      - name: Package .ipa
        run: |
          APP_PATH=$(find sources/build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          echo "APP_PATH=$APP_PATH"
          test -n "$APP_PATH"
          rm -rf Payload IPTV-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr IPTV-unsigned.ipa Payload
          rm -rf Payload
          ls -lh IPTV-unsigned.ipa
          shasum -a 256 IPTV-unsigned.ipa | tee sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: IPTV-ios-unsigned
          path: |
            IPTV-unsigned.ipa
            sha256.txt
          retention-days: 14
