name: build-ios-ipa

on:
  workflow_dispatch:
    inputs:
      bundle-id:
        description: "fr.turbo.IPTV"
        default: "fr.turbo.IPTV"
        required: true

concurrency:
  group: ios-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 16 (Realm ne compile pas avec Xcode 26)
        run: |
          ls -d /Applications/Xcode*.app
          XCODE16=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE16" ]; then
            echo "Selection: $XCODE16"
            sudo xcode-select -s "$XCODE16"
          else
            echo "Pas de Xcode 16 trouve, on garde le defaut"
          fi
          xcodebuild -version

      - name: Remonte les sources si imbriquees dans un sous-dossier
        run: |
          if [ ! -f sources/IPTV.xcodeproj/project.pbxproj ]; then
            for d in */; do
              if [ -f "${d}sources/IPTV.xcodeproj/project.pbxproj" ]; then
                echo "Remontee depuis $d"
                shopt -s dotglob nullglob
                mv "${d}"* ./
                rmdir "$d" || true
                break
              fi
            done
          fi
          test -f sources/IPTV.xcodeproj/project.pbxproj || (echo "ERREUR: projet introuvable" && exit 1)

      - name: Bundle ID perso
        run: |
          BID="${{ inputs.bundle-id }}"
          PBX=sources/IPTV.xcodeproj/project.pbxproj
          sed -i '' "s/fr\.meublin\.IPTV/${BID}/g" "$PBX"
          grep -o 'PRODUCT_BUNDLE_IDENTIFIER = [^;]*;' "$PBX" | sort -u

      - name: Carthage + VLCKit
        run: |
          brew install carthage || brew upgrade carthage
          cd sources
          carthage bootstrap --use-xcframeworks --platform iOS --cache-builds

      - name: GoogleCast SDK (manquant du depot)
        run: |
          cd sources
          if [ ! -d GoogleCast.xcframework ]; then
            curl -L -o /tmp/cast.zip https://dl.google.com/dl/chromecast/sdk/ios/GoogleCastSDK-ios-4.8.6_dynamic.zip
            rm -rf /tmp/cast && mkdir -p /tmp/cast
            unzip -q /tmp/cast.zip -d /tmp/cast
            cp -R /tmp/cast/GoogleCastSDK-ios-4.8.6_dynamic_xcframework/GoogleCast.xcframework ./GoogleCast.xcframework
            rm -rf /tmp/cast /tmp/cast.zip
          fi
          ls -d GoogleCast.xcframework

      - name: Build (unsigned, pour sideload)
        run: |
          cd sources
          set -o pipefail
          xcodebuild \
            -project IPTV.xcodeproj \
            -scheme IPTV-iOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | tail -n 50

      - name: Log de build (si echec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: sources/build.log
          retention-days: 14

      - name: Package .ipa
        run: |
          APP_PATH=$(find sources/build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          echo "APP_PATH=$APP_PATH"
          test -n "$APP_PATH"
          rm -rf Payload IPTV-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr IPTV-unsigned.ipa Payload
          rm -rf Payload
          ls -lh IPTV-unsigned.ipa
          shasum -a 256 IPTV-unsigned.ipa | tee sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: IPTV-ios-unsigned
          path: |
            IPTV-unsigned.ipa
            sha256.txt
          retention-days: 14
